name: Cron Publish

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron-publish endpoint
        run: |
          curl -sS -o /tmp/cron.json -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://contentplanz.vercel.app/api/cron-publish
          cat /tmp/cron.json
